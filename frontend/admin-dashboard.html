<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVault — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-dashboard.css">
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
    <div class="topnav-inner">
        <a href="#" class="brand">Tech<span>Vault</span></a>
        <span class="nav-tag">Admin Console</span>
    </div>
</nav>

<div class="admin-wrap">

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h1>Dashboard</h1>
        <p>Manage products, orders, and customer accounts</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="products">Product Management</button>
        <button class="tab-btn" data-tab="orders">Customer Orders</button>
        <button class="tab-btn" data-tab="accounts">Customer Accounts</button>
    </div>

    <!-- PRODUCT MANAGEMENT TAB -->
    <div id="tab-products" class="tab-content active">

        <div class="card">
            <div class="card-header">
                <h2>Add / Edit Product</h2>
            </div>
            <div class="card-body">
                <form id="productForm" enctype="multipart/form-data">
                    <input type="hidden" id="productId">
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Product Name</label>
                            <input type="text" id="prodName" placeholder="e.g. Sony WH-1000XM5" required>
                        </div>
                        <div class="form-field">
                            <label>Price (USD)</label>
                            <input type="number" id="prodPrice" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-field">
                            <label>Stock</label>
                            <input type="number" id="prodStock" placeholder="0" required>
                        </div>
                        <div class="form-field">
                            <label>Category</label>
                            <input type="text" id="prodCategory" placeholder="e.g. IEM, Keyboard, Mouse">
                        </div>
                        <div class="form-field">
                            <label>Product Image</label>
                            <input type="file" id="prodImage" accept="image/*">
                        </div>
                    </div>
                    <div class="img-preview-wrap" id="currentImageContainer" style="display:none; display:flex;">
                        <label>Current Image</label>
                        <img id="currentImagePreview" src="" alt="Current product image">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Save Product</button>
                        <button type="button" id="clearFormBtn" class="btn btn-outline">Clear Form</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Product Catalog</h2>
            </div>
            <div class="card-body">
                <div class="action-bar">
                    <div class="search-group">
                        <input type="text" id="productSearch" placeholder="Search by name or category...">
                        <button id="searchProductsBtn" class="btn btn-ink btn-sm">Search</button>
                        <button id="resetProductsBtn" class="btn btn-outline btn-sm">Reset</button>
                    </div>
                    <div class="limit-group">
                        <label>Show</label>
                        <select id="productLimit">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="999999">All</option>
                        </select>
                    </div>
                </div>
                <div id="adminProductList" class="product-list"></div>
                <div id="productResultsInfo" class="results-info"></div>
            </div>
        </div>

    </div><!-- /tab-products -->

    <!-- ORDERS TAB -->
    <div id="tab-orders" class="tab-content">
        <div class="card">
            <div class="card-header">
                <h2>Customer Orders</h2>
            </div>
            <div class="card-body">
                <div class="action-bar">
                    <div class="search-group">
                        <input type="text" id="orderSearch" placeholder="Search by customer, email or product...">
                        <button id="searchOrdersBtn" class="btn btn-ink btn-sm">Search</button>
                        <button id="resetOrdersBtn" class="btn btn-outline btn-sm">Reset</button>
                    </div>
                    <div class="limit-group">
                        <label>Show</label>
                        <select id="orderLimit">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="999999">All</option>
                        </select>
                    </div>
                </div>
                <div class="table-wrap">
                    <div id="ordersList" class="orders-list"></div>
                </div>
                <div id="orderResultsInfo" class="results-info"></div>
            </div>
        </div>
    </div>

    <!-- ACCOUNTS TAB -->
    <div id="tab-accounts" class="tab-content">
        <div class="card">
            <div class="card-header">
                <h2>Customer Accounts</h2>
            </div>
            <div class="card-body">
                <div class="action-bar">
                    <div class="search-group">
                        <input type="text" id="userSearch" placeholder="Search by name or email...">
                        <button id="searchUsersBtn" class="btn btn-ink btn-sm">Search</button>
                        <button id="resetUsersBtn" class="btn btn-outline btn-sm">Reset</button>
                    </div>
                    <div class="limit-group">
                        <label>Show</label>
                        <select id="userLimit">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="999999">All</option>
                        </select>
                    </div>
                </div>
                <div id="userList" class="user-list"></div>
                <div id="userResultsInfo" class="results-info"></div>
            </div>
        </div>
    </div>

</div><!-- /admin-wrap -->

<!-- PRODUCT DETAIL MODAL (attributes & reviews) -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="detailProductName">Manage Product</h3>
            <button class="modal-close" title="Close">&times;</button>
        </div>
        <div class="modal-body" id="detailContent"></div>
    </div>
</div>

<!-- EDIT USER MODAL -->
<div id="editUserModal" class="modal edit-user-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit Customer</h3>
            <button class="modal-close" id="closeEditUserModal">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editUserId">
            <div class="form-field">
                <label>Full Name</label>
                <input type="text" id="editFullName" placeholder="Full name">
            </div>
            <div class="form-field">
                <label>Email</label>
                <input type="email" id="editEmail" placeholder="Email address">
            </div>
            <div class="form-field">
                <label>Birth Date</label>
                <input type="date" id="editBirthdate">
            </div>
            <div class="form-field">
                <label>Shipping Address</label>
                <textarea id="editAddress" rows="3" placeholder="Full shipping address"></textarea>
            </div>
            <div class="form-actions" style="margin-top:4px">
                <button id="saveUserEditBtn" class="btn btn-success">Save Changes</button>
                <button id="cancelUserEditBtn" class="btn btn-outline">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script src="admin-dashboard.js"></script>
</body>
</html>
